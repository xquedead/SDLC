<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="990" viewBox="0 0 1390 990" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="open" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,5 L1,9" fill="none" stroke="#334155" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1390" height="990" fill="#ffffff"/>

  <text x="695" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">Диаграмма классов — «Калькулятор лени», вариант 21</text>
  <text x="695" y="68" text-anchor="middle" font-size="13" fill="#475569">Каркас MVC с активной моделью. Qt 6, C++17. Классы Qt показаны серым.</text>

  <!-- ================= LANES ================= -->
  <rect x="10"  y="100" width="420" height="710" rx="10" fill="#f2f7fd" stroke="#93b4d8" stroke-width="1"/>
  <rect x="460" y="100" width="460" height="710" rx="10" fill="#fff9f0" stroke="#d8a95f" stroke-width="1"/>
  <rect x="950" y="100" width="420" height="710" rx="10" fill="#f2fbf3" stroke="#6aa877" stroke-width="1"/>

  <text x="220"  y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5c93" letter-spacing="1">VIEW — ПРЕДСТАВЛЕНИЕ</text>
  <text x="690"  y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6612" letter-spacing="1">CONTROLLER — КОНТРОЛЛЕР</text>
  <text x="1160" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#3d7a4c" letter-spacing="1">MODEL — МОДЕЛЬ</text>

  <!-- ================= Qt BASE CLASSES ================= -->
  <rect x="140" y="150" width="160" height="32" rx="4" fill="#eceff3" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="220" y="171" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">QMainWindow</text>

  <rect x="610" y="150" width="160" height="32" rx="4" fill="#eceff3" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="690" y="171" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">QObject</text>

  <rect x="1080" y="150" width="160" height="32" rx="4" fill="#eceff3" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="1160" y="171" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">QObject</text>

  <rect x="140" y="520" width="160" height="32" rx="4" fill="#eceff3" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="220" y="541" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">QDialog</text>

  <!-- ================= MainWindow ================= -->
  <rect x="30" y="215" width="380" height="263" fill="#ffffff" stroke="#93b4d8" stroke-width="1.6"/>
  <rect x="30" y="215" width="380" height="48" fill="#dbeafe" stroke="#93b4d8" stroke-width="1.6"/>
  <text x="220" y="233" text-anchor="middle" font-size="11" font-style="italic" fill="#2c5c93">&#171;view&#187;</text>
  <text x="220" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MainWindow</text>
  <line x1="30" y1="328" x2="410" y2="328" stroke="#93b4d8" stroke-width="1.2"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#334155">
    <text x="42" y="281">- ui: Ui::MainWindow*</text>
    <text x="42" y="298">- m_model: LazinessModel*</text>
    <text x="42" y="315">- m_controller: LazinessController*</text>
    <text x="42" y="346">+ MainWindow(model: LazinessModel*,</text>
    <text x="82" y="363">controller: LazinessController*,</text>
    <text x="82" y="380">parent: QWidget* = nullptr)</text>
    <text x="42" y="397">+ ~MainWindow()</text>
    <text x="42" y="414">- &#171;slot&#187; onInputClicked(): void</text>
    <text x="42" y="431">- &#171;slot&#187; refresh(): void</text>
    <text x="42" y="448">- showEmptyState(): void</text>
    <text x="42" y="465">- showResult(): void</text>
  </g>

  <!-- ================= LazinessController ================= -->
  <rect x="500" y="215" width="380" height="161" fill="#ffffff" stroke="#d8a95f" stroke-width="1.6"/>
  <rect x="500" y="215" width="380" height="48" fill="#fde9c9" stroke="#d8a95f" stroke-width="1.6"/>
  <text x="690" y="233" text-anchor="middle" font-size="11" font-style="italic" fill="#9a6612">&#171;controller&#187;</text>
  <text x="690" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">LazinessController</text>
  <line x1="500" y1="294" x2="880" y2="294" stroke="#d8a95f" stroke-width="1.2"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#334155">
    <text x="512" y="281">- m_model: LazinessModel*</text>
    <text x="512" y="312">+ LazinessController(model: LazinessModel*,</text>
    <text x="552" y="329">parent: QObject* = nullptr)</text>
    <text x="512" y="346">+ submit(plannedText: QString, doneText: QString,</text>
    <text x="552" y="363">errorMessage: QString*): bool</text>
  </g>

  <!-- ================= LazinessModel ================= -->
  <rect x="970" y="215" width="380" height="433" fill="#ffffff" stroke="#6aa877" stroke-width="1.6"/>
  <rect x="970" y="215" width="380" height="48" fill="#d6efd9" stroke="#6aa877" stroke-width="1.6"/>
  <text x="1160" y="233" text-anchor="middle" font-size="11" font-style="italic" fill="#3d7a4c">&#171;model&#187;</text>
  <text x="1160" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">LazinessModel</text>
  <line x1="970" y1="430" x2="1350" y2="430" stroke="#6aa877" stroke-width="1.2"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#334155">
    <text x="982" y="281">+ kMinPlanned: int = 1 {readOnly}</text>
    <text x="982" y="298">+ kMinDone: int = 0 {readOnly}</text>
    <text x="982" y="315">+ kMaxTasks: int = 1000 {readOnly}</text>
    <text x="982" y="332">- m_planned: int = 0</text>
    <text x="982" y="349">- m_done: int = 0</text>
    <text x="982" y="366">- m_coefficient: double = 0.0</text>
    <text x="982" y="383">- m_level: QString</text>
    <text x="982" y="400">- m_phrase: QString</text>
    <text x="982" y="417">- m_hasData: bool = false</text>
    <text x="982" y="448">+ LazinessModel(parent: QObject* = nullptr)</text>
    <text x="982" y="465">+ setData(planned: int, done: int): bool</text>
    <text x="982" y="482">+ clear(): void</text>
    <text x="982" y="499">+ isValid(planned: int, done: int): bool {static}</text>
    <text x="982" y="516">+ planned(): int {query}</text>
    <text x="982" y="533">+ done(): int {query}</text>
    <text x="982" y="550">+ coefficient(): double {query}</text>
    <text x="982" y="567">+ level(): QString {query}</text>
    <text x="982" y="584">+ phrase(): QString {query}</text>
    <text x="982" y="601">+ hasData(): bool {query}</text>
    <text x="982" y="618" font-weight="700" fill="#1f6b36">+ &#171;signal&#187; dataChanged(): void</text>
    <text x="982" y="635">- recalculate(): void</text>
  </g>

  <!-- ================= InputDialog ================= -->
  <rect x="30" y="585" width="380" height="178" fill="#ffffff" stroke="#93b4d8" stroke-width="1.6"/>
  <rect x="30" y="585" width="380" height="48" fill="#dbeafe" stroke="#93b4d8" stroke-width="1.6"/>
  <text x="220" y="603" text-anchor="middle" font-size="11" font-style="italic" fill="#2c5c93">&#171;view&#187;</text>
  <text x="220" y="623" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">InputDialog</text>
  <line x1="30" y1="664" x2="410" y2="664" stroke="#93b4d8" stroke-width="1.2"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#334155">
    <text x="42" y="651">- ui: Ui::InputDialog*</text>
    <text x="42" y="682">+ InputDialog(parent: QWidget* = nullptr)</text>
    <text x="42" y="699">+ ~InputDialog()</text>
    <text x="42" y="716">+ setValues(planned: QString, done: QString): void</text>
    <text x="42" y="733">+ plannedText(): QString {query}</text>
    <text x="42" y="750">+ doneText(): QString {query}</text>
  </g>

  <!-- ================= Grade (деталь реализации модели) ================= -->
  <rect x="1020" y="680" width="280" height="113" fill="#ffffff" stroke="#6aa877" stroke-width="1.4"/>
  <rect x="1020" y="680" width="280" height="48" fill="#e9f5ea" stroke="#6aa877" stroke-width="1.4"/>
  <text x="1160" y="698" text-anchor="middle" font-size="11" font-style="italic" fill="#3d7a4c">&#171;struct&#187;</text>
  <text x="1160" y="718" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Grade</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#334155">
    <text x="1032" y="746">+ upperBound: double</text>
    <text x="1032" y="763">+ level: const char*</text>
    <text x="1032" y="780">+ phrase: const char*</text>
  </g>

  <!-- ================= GENERALIZATIONS ================= -->
  <g stroke="#64748b" stroke-width="1.4" fill="none">
    <line x1="220"  y1="215" x2="220"  y2="194"/>
    <line x1="690"  y1="215" x2="690"  y2="194"/>
    <line x1="1160" y1="215" x2="1160" y2="194"/>
    <line x1="220"  y1="585" x2="220"  y2="564"/>
  </g>
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.4">
    <polygon points="212,194 228,194 220,182"/>
    <polygon points="682,194 698,194 690,182"/>
    <polygon points="1152,194 1168,194 1160,182"/>
    <polygon points="212,564 228,564 220,552"/>
  </g>

  <!-- ================= ASSOCIATIONS ================= -->
  <!-- MainWindow -> LazinessController -->
  <line x1="410" y1="290" x2="498" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="454" y="282" text-anchor="middle" font-size="10.5" fill="#475569">&#171;uses&#187;</text>
  <text x="490" y="305" text-anchor="middle" font-size="10.5" fill="#475569">1</text>

  <!-- LazinessController -> LazinessModel -->
  <line x1="880" y1="290" x2="968" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="924" y="282" text-anchor="middle" font-size="10.5" fill="#475569">&#171;uses&#187;</text>
  <text x="960" y="305" text-anchor="middle" font-size="10.5" fill="#475569">1</text>

  <!-- MainWindow -> LazinessModel (только чтение) -->
  <line x1="410" y1="410" x2="968" y2="410" stroke="#334155" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="689" y="402" text-anchor="middle" font-size="10.5" fill="#475569">&#171;uses&#187; читает данные для отрисовки</text>

  <!-- LazinessModel ..> MainWindow : сигнал -->
  <path d="M968,499 H220 V480" fill="none" stroke="#1f6b36" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#open)"/>
  <text x="620" y="491" text-anchor="middle" font-size="11" font-weight="600" fill="#1f6b36">&#171;signal&#187; dataChanged() &#8594; refresh()</text>

  <!-- MainWindow ..> InputDialog -->
  <path d="M90,478 V583" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/>
  <text x="98" y="536" font-size="10.5" fill="#475569">&#171;create&#187;</text>

  <!-- LazinessModel ..> Grade -->
  <path d="M1160,648 V678" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/>
  <text x="1170" y="668" font-size="10.5" fill="#475569">&#171;uses&#187; шкала уровней</text>

  <!-- ================= NOTES ================= -->
  <rect x="10" y="830" width="660" height="140" rx="8" fill="#fbfbfd" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="26" y="852" font-size="12" font-weight="700" fill="#0f172a">main.cpp — точка сборки (composition root)</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#334155">
    <text x="26" y="874">LazinessModel      model;</text>
    <text x="26" y="891">LazinessController controller(&amp;model);</text>
    <text x="26" y="908">MainWindow         window(&amp;model, &amp;controller);</text>
  </g>
  <text x="26" y="931" font-size="11" fill="#475569">Ни один слой не создаёт другой: все связи задаются снаружи.</text>
  <text x="26" y="948" font-size="11" fill="#475569">Модель не включает ни одного заголовка виджета и о View не знает.</text>

  <rect x="700" y="830" width="670" height="140" rx="8" fill="#fbfbfd" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="716" y="852" font-size="12" font-weight="700" fill="#0f172a">Обозначения</text>

  <line x1="722" y1="870" x2="762" y2="870" stroke="#64748b" stroke-width="1.4"/>
  <polygon points="762,864 762,876 774,870" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
  <text x="786" y="874" font-size="11" fill="#475569">наследование (Qt-классы)</text>

  <line x1="722" y1="893" x2="770" y2="893" stroke="#334155" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="786" y="897" font-size="11" fill="#475569">ассоциация: класс хранит указатель и вызывает методы</text>

  <line x1="722" y1="916" x2="770" y2="916" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/>
  <text x="786" y="920" font-size="11" fill="#475569">зависимость: создание или использование по месту</text>

  <line x1="722" y1="939" x2="770" y2="939" stroke="#1f6b36" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#open)"/>
  <text x="786" y="943" font-size="11" fill="#1f6b36">сигнал Qt: активная модель сама уведомляет View</text>
</svg>
